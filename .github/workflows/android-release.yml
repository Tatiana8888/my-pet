name: Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: "platform-tools,platforms;android-35,build-tools;35.0.0"

      - name: Build signed APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION_NAME#v}"
          bash ./gradlew --no-daemon clean assembleRelease \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$BUILD_NUMBER"

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-pet-android
          path: android/app/build/outputs/apk/release/my-pet-android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" android/app/build/outputs/apk/release/my-pet-android.apk --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              android/app/build/outputs/apk/release/my-pet-android.apk \
              --title "My Pet Android ${GITHUB_REF_NAME}" \
              --notes "Install the My Pet Android app. This release is signed for direct installation; it is not a Play Store release."
          fi
