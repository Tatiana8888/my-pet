name: Publish web app

on:
  push:
    branches:
      - tatiana8888-my-pet-app
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the web app
        run: |
          mkdir -p publish/assets
          cp index.html app.js styles.css robots.txt sitemap.xml publish/
          cp assets/*.svg publish/assets/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
